<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · FleetFlow</title>
  <style>
    :root {
      --primary: #2563EB;
      --bg: #F8FAFC;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .offline-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -4px rgba(15, 23, 42, 0.08);
    }
    .icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #EFF6FF;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
      border: 1px solid #BFDBFE;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #1D4ED8;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 0.8rem;
      color: #DC2626;
      background: #FEF2F2;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid #FEE2E2;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-badge">📡</div>
    <h1>You're Offline</h1>
    <p>
      FleetFlow cannot connect to the network. Live telemetry, weather advisories, and cloud sync will resume automatically once your internet connection is restored.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Try Reconnecting
    </button>
    <div>
      <span class="status-pill">
        <span class="status-dot"></span> No Network Connection
      </span>
    </div>
  </div>
</body>
</html>
